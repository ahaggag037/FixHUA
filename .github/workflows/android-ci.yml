name: FixHUA Root Guard Android CI

on:
  push:
    branches: [ main, 'build/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: UI button wiring contract
        run: |
          FILE=app/src/main/java/com/fixhua/diagnostics/MainActivity.java
          grep -Fq 'rootProbe.setOnClickListener(v -> probeRoot());' "$FILE"
          grep -Fq 'start.setOnClickListener(v -> startProtected());' "$FILE"
          grep -Fq 'modeButton.setOnClickListener(v -> cycleMode());' "$FILE"
          grep -Fq 'usage.setOnClickListener(v -> openUsageAccess());' "$FILE"
          grep -Fq 'huawei.setOnClickListener(v -> openHuaweiStartupManager());' "$FILE"
          grep -Fq 'battery.setOnClickListener(v -> requestOwnBatteryExemption());' "$FILE"
          grep -Fq 'reopen.setOnClickListener(v -> launchGBox());' "$FILE"
          grep -Fq 'diagnosticButton.setOnClickListener(v -> toggleDeepDiagnostics());' "$FILE"
          grep -Fq 'lagMarker.setOnClickListener(v -> markLagNow());' "$FILE"
          grep -Fq 'report.setOnClickListener(v -> generateAndCopyReport(report));' "$FILE"
          grep -Fq 'stop.setOnClickListener(v -> stopGuard());' "$FILE"
          grep -Fq 'refresh.setOnClickListener(v -> refreshStatus());' "$FILE"
          grep -Fq 'android:name=".DeepDiagnosticService"' app/src/main/AndroidManifest.xml
          grep -Fq 'versionName = "3.2.0"' app/build.gradle.kts

      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Lint release
        run: gradle --stacktrace lintRelease

      - name: Build unsigned release APK
        run: gradle --stacktrace assembleRelease

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fixhua-release.jks" \
            -storepass "FixHUA-CI-2026" \
            -keypass "FixHUA-CI-2026" \
            -alias fixhua \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=FixHUA Root Guard, OU=Personal Android, O=FixHUA, C=EG" \
            -storetype PKCS12

      - name: Align and sign release APK
        run: |
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/FixHUA-RootGuard-v3.2.0.apk
          test -s "$IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fixhua-release.jks" \
            --ks-key-alias fixhua \
            --ks-pass pass:FixHUA-CI-2026 \
            --key-pass pass:FixHUA-CI-2026 \
            "$OUT"

      - name: Verify release APK
        run: |
          APK=app/build/outputs/apk/release/FixHUA-RootGuard-v3.2.0.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -60 | tee app/build/outputs/apk/release/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee app/build/outputs/apk/release/apk-permissions.txt
          sha256sum "$APK" | tee app/build/outputs/apk/release/FixHUA-RootGuard-v3.2.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FixHUA-RootGuard-v3.2.0-release
          path: |
            app/build/outputs/apk/release/FixHUA-RootGuard-v3.2.0.apk
            app/build/outputs/apk/release/FixHUA-RootGuard-v3.2.0.apk.sha256
            app/build/outputs/apk/release/apksigner.txt
            app/build/outputs/apk/release/apk-badging.txt
            app/build/outputs/apk/release/apk-permissions.txt
          if-no-files-found: error
