name: Huawei Legacy Probe CI

on:
  push:
    branches: [ 'build/huawei-legacy-probe-v1' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint legacy probe
        run: gradle --stacktrace :legacyprobe:lintRelease

      - name: Build legacy probe
        run: gradle --stacktrace :legacyprobe:assembleRelease

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/legacy-probe.jks" \
            -storepass "Legacy-Probe-CI-2026" \
            -keypass "Legacy-Probe-CI-2026" \
            -alias legacy-probe \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Huawei Legacy Probe, OU=Personal Android, O=Legacy Probe, C=EG" \
            -storetype PKCS12

      - name: Align and sign APK
        run: |
          mkdir -p legacyprobe/build/outputs/final
          IN=legacyprobe/build/outputs/apk/release/legacyprobe-release-unsigned.apk
          OUT=legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk
          test -s "$IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/legacy-probe.jks" \
            --ks-key-alias legacy-probe \
            --ks-pass pass:Legacy-Probe-CI-2026 \
            --key-pass pass:Legacy-Probe-CI-2026 \
            "$OUT"

      - name: Verify APK
        run: |
          APK=legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee legacyprobe/build/outputs/final/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee legacyprobe/build/outputs/final/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee legacyprobe/build/outputs/final/apk-permissions.txt
          grep -q "package: name='com.huawei.legacyprobe' versionCode='1' versionName='1.0.0'" legacyprobe/build/outputs/final/apk-badging.txt
          grep -q "sdkVersion:'23'" legacyprobe/build/outputs/final/apk-badging.txt
          grep -q "targetSdkVersion:'28'" legacyprobe/build/outputs/final/apk-badging.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" legacyprobe/build/outputs/final/apk-permissions.txt
          grep -q "android.permission.ACCESS_WIFI_STATE" legacyprobe/build/outputs/final/apk-permissions.txt
          for forbidden in READ_CONTACTS READ_SMS READ_PHONE_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION MANAGE_EXTERNAL_STORAGE WRITE_SECURE_SETTINGS PACKAGE_USAGE_STATS; do
            if grep -q "android.permission.$forbidden" legacyprobe/build/outputs/final/apk-permissions.txt; then
              echo "Forbidden permission present: $forbidden"
              exit 1
            fi
          done
          sha256sum "$APK" | tee legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 9 install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk
            adb logcat -c
            adb shell am force-stop com.huawei.legacyprobe
            adb shell am start -W -n com.huawei.legacyprobe/.MainActivity | tee legacyprobe/build/outputs/final/smoke-start.txt
            sleep 5
            adb shell pidof com.huawei.legacyprobe | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -F "com.huawei.legacyprobe/.MainActivity"
            test -z "$(adb logcat -d -s AndroidRuntime:E | grep -F 'Process: com.huawei.legacyprobe' || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: Huawei-Legacy-Probe-v1.0.0
          path: |
            legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk
            legacyprobe/build/outputs/final/Huawei-Legacy-Probe-v1.0.0.apk.sha256
            legacyprobe/build/outputs/final/apksigner.txt
            legacyprobe/build/outputs/final/apk-badging.txt
            legacyprobe/build/outputs/final/apk-permissions.txt
            legacyprobe/build/outputs/final/smoke-start.txt
            legacyprobe/build/reports/lint-results-release.html
          if-no-files-found: error
