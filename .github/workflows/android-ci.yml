name: FixHUA Auto System Diagnostics Android CI

on:
  push:
    branches: [ main, 'build/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Automatic diagnostics contract
        run: |
          UI=app/src/main/java/com/fixhua/diagnostics/MainActivity.java
          SVC=app/src/main/java/com/fixhua/diagnostics/DeepDiagnosticService.java
          TL=app/src/main/java/com/fixhua/diagnostics/DiagnosticTimeline.java
          grep -Fq 'diagnosticButton.setOnClickListener(v -> toggleDeepDiagnostics());' "$UI"
          grep -Fq 'copyReportButton.setOnClickListener(v -> copyLatestReport());' "$UI"
          ! grep -Fq 'user_lag_marker' "$UI"
          ! grep -Fq 'markLagNow' "$UI"
          grep -Fq 'new HandlerThread("FixHUA-DiagnosticSampler"' "$SVC"
          grep -Fq 'PowerManager.PARTIAL_WAKE_LOCK' "$SVC"
          grep -Fq 'AutomaticIncidentDetector' "$SVC"
          grep -Fq 'RESULT_CHANNEL' "$SVC"
          grep -Fq 'memoryPsiAvailable=' "$TL"
          grep -Fq 'sampleGapMs=' "$TL"
          grep -Fq 'versionName = "3.3.0"' app/build.gradle.kts
          grep -Fq 'android:name=".DeepDiagnosticService"' app/src/main/AndroidManifest.xml

      - name: Unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Lint release
        run: gradle --stacktrace lintRelease

      - name: Build unsigned release APK
        run: gradle --stacktrace assembleRelease

      - name: Create ephemeral key and sign release APK
        run: |
          export SIGN_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fixhua-release.jks" \
            -storepass "$SIGN_PASS" \
            -keypass "$SIGN_PASS" \
            -alias fixhua \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=FixHUA Auto System Diagnostics, OU=Personal Android, O=FixHUA, C=EG" \
            -storetype PKCS12
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/FixHUA-AutoSystem-v3.3.0.apk
          test -s "$IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fixhua-release.jks" \
            --ks-key-alias fixhua \
            --ks-pass env:SIGN_PASS \
            --key-pass env:SIGN_PASS \
            "$OUT"

      - name: Verify release APK
        run: |
          APK=app/build/outputs/apk/release/FixHUA-AutoSystem-v3.3.0.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -60 | tee app/build/outputs/apk/release/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee app/build/outputs/apk/release/apk-permissions.txt
          sha256sum "$APK" | tee app/build/outputs/apk/release/FixHUA-AutoSystem-v3.3.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FixHUA-AutoSystem-v3.3.0-release
          path: |
            app/build/outputs/apk/release/FixHUA-AutoSystem-v3.3.0.apk
            app/build/outputs/apk/release/FixHUA-AutoSystem-v3.3.0.apk.sha256
            app/build/outputs/apk/release/apksigner.txt
            app/build/outputs/apk/release/apk-badging.txt
            app/build/outputs/apk/release/apk-permissions.txt
          if-no-files-found: error
