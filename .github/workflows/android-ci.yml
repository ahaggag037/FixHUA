name: FixHUA Diagnostic Probe CI

on:
  push:
    branches: [ main, 'build/**', 'release/**', 'rewrite/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle --stacktrace testReleaseUnitTest

      - name: Lint release
        run: |
          if ! gradle --stacktrace lintRelease; then
            echo "===== FULL LINT REPORT ====="
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
            exit 1
          fi

      - name: Build unsigned release APK
        run: gradle --stacktrace assembleRelease

      - name: Create temporary diagnostic signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fixhua-probe.jks" \
            -storepass "FixHUA-Probe-CI-2026" \
            -keypass "FixHUA-Probe-CI-2026" \
            -alias fixhua-probe \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=FixHUA Diagnostic Probe, OU=Personal Android, O=FixHUA, C=EG" \
            -storetype PKCS12

      - name: Align and sign release APK
        run: |
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk
          test -s "$IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fixhua-probe.jks" \
            --ks-key-alias fixhua-probe \
            --ks-pass pass:FixHUA-Probe-CI-2026 \
            --key-pass pass:FixHUA-Probe-CI-2026 \
            "$OUT"

      - name: Verify APK identity, signature, and permission surface
        run: |
          APK=app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee app/build/outputs/apk/release/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee app/build/outputs/apk/release/apk-permissions.txt
          grep -q "package: name='com.fixhua.probe' versionCode='30' versionName='3.0.0'" app/build/outputs/apk/release/apk-badging.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" app/build/outputs/apk/release/apk-permissions.txt
          grep -q "android.permission.PACKAGE_USAGE_STATS" app/build/outputs/apk/release/apk-permissions.txt
          grep -q "android.permission.QUERY_ALL_PACKAGES" app/build/outputs/apk/release/apk-permissions.txt
          for forbidden in INTERNET READ_LOGS DUMP MANAGE_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_PHONE_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW REQUEST_IGNORE_BATTERY_OPTIMIZATIONS KILL_BACKGROUND_PROCESSES; do
            if grep -q "android.permission.$forbidden" app/build/outputs/apk/release/apk-permissions.txt; then
              echo "Unexpected permission present: $forbidden"
              exit 1
            fi
          done
          sha256sum "$APK" | tee app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk.sha256

      - name: Enable KVM for Android 12 smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 12 install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk
            adb logcat -c
            adb shell am force-stop com.fixhua.probe
            adb shell am start -W -n com.fixhua.probe/com.fixhua.guard.MainActivity | tee app/build/outputs/apk/release/smoke-start.txt
            sleep 4
            adb shell pidof com.fixhua.probe | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -F "com.fixhua.guard.MainActivity"
            test -z "$(adb logcat -d -s AndroidRuntime:E | grep -F 'Process: com.fixhua.probe' || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: FixHUA-Diagnostic-Probe-v3.0.0-release
          path: |
            app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk
            app/build/outputs/apk/release/FixHUA-Diagnostic-Probe-v3.0.0.apk.sha256
            app/build/outputs/apk/release/apksigner.txt
            app/build/outputs/apk/release/apk-badging.txt
            app/build/outputs/apk/release/apk-permissions.txt
            app/build/outputs/apk/release/smoke-start.txt
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.html
          if-no-files-found: error
