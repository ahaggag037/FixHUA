name: Build INE System Probe

on:
  push:
    branches:
      - system-probe-ine-lx1r
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build, unit tests and lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify Android 9 compatibility and APK signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "sdkVersion:'28'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.haggag.inesystemprobe.MainActivity'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload verified Android 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: INE-System-Probe-Android9-Verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
